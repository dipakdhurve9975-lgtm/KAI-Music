// Resolve the actual distributed variant; private cache paths stay in build/ only.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
gradle.projectsEvaluated {
    rootProject.tasks.register('kaiRuntimeArtifacts') {
        doLast {
            def app = rootProject.project(':app')
            def artifacts = app.configurations.getByName('universalGmsDebugRuntimeClasspath').incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts
            def rows = artifacts.collect { a ->
                [coordinate: a.id.componentIdentifier.toString(), file: a.file.absolutePath]
            }.sort { it.coordinate }
            def target = new File(rootProject.layout.buildDirectory.get().asFile, 'kai-runtime-artifacts.json')
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(rows))
            println "Runtime inventory: ${rows.size()} artifacts; private paths written to build/ only"
        }
    }
}
