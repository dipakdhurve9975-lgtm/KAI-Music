# KAI modification notice (2026-10-28): dependency-update PRs require maintainer opt-in.
version: 2
updates:
  # Enable updates for Gradle/Android dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      
  # Enable updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github_actions"
