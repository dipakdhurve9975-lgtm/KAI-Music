# Modified for KAI Music on 2026-10-28; GPL-3.0. Validation never publishes.
name: KAI Android validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 
      - name: Verify public source and release tooling
        run: |
          python3 scripts/release_tools.py scan
          python3 -m unittest discover -s scripts/tests -v
      - name: Create disposable CI debug key (never a published signing identity)
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=KAI CI,O=Disposable validation,C=US' -keyalg RSA -keysize 2048 -validity 2
          fi
      - name: Build and test Universal GMS debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalGmsDebug :app:testUniversalGmsDebugUnitTest :core:testDebugUnitTest :lyrics:testDebugUnitTest :youlyplus:testDebugUnitTest -PkaiPublicBuild=true -PFLOW_NEURO_API_KEY= --max-workers=2 --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KAI-CI-universal-gms-debug-not-for-distribution
          path: app/build/outputs/apk/universalGms/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: KAI-test-reports
          path: '**/build/test-results/**/TEST-*.xml'
